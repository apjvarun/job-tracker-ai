# Matching settings
matching:
  model: "gemini-2.5-flash-lite"
  max_tokens: 500
  include_tier3_in_digest: false

# Notification settings
notifications:
  telegram:
    enabled: true
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    recipient: "${NOTIFICATION_EMAIL}"  # Set via .env or override here
    digest_hour: 9  # 9 AM PT

# General settings
settings:
  database_path: "data/jobs.db"
  resume_path: "resume.txt"
  log_level: "INFO"
  poll_interval_minutes: 15
