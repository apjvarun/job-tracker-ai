<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Abstract radar/pulse with briefcase hint -->
  <g transform="translate(10, 10)">
    <!-- Outer ring -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#iconGrad)" stroke-width="3" stroke-dasharray="60 180" transform="rotate(-45, 40, 40)" opacity="0.3"/>
    <!-- Middle ring -->
    <circle cx="40" cy="40" r="28" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-dasharray="44 132" transform="rotate(-45, 40, 40)" opacity="0.5"/>
    <!-- Inner filled circle -->
    <circle cx="40" cy="40" r="18" fill="url(#grad)"/>
    <!-- Briefcase icon inside circle -->
    <rect x="31" y="36" width="18" height="12" rx="2" fill="none" stroke="white" stroke-width="1.8"/>
    <path d="M36 36 V33 A2 2 0 0 1 38 31 H42 A2 2 0 0 1 44 33 V36" fill="none" stroke="white" stroke-width="1.8"/>
    <!-- AI dot/pulse -->
    <circle cx="58" cy="22" r="4" fill="#A855F7" opacity="0.8"/>
    <circle cx="58" cy="22" r="7" fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Text: jobai -->
  <text x="105" y="65" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="46" font-weight="700" fill="#1E1B4B">
    job<tspan fill="url(#grad)">ai</tspan>
  </text>

  <!-- Text: .live -->
  <text x="255" y="65" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="46" font-weight="300" fill="#9CA3AF">
    .live
  </text>
</svg>
